name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
permissions:
  # needed to allow julia-actions/cache to delete old caches that it has created
  actions: write
  contents: read
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    # Windows precompilation (ModelingToolkit, Symbolics, GLMakie, ...) is much slower than on
    # Linux/macOS, so it needs a bigger budget than the other platforms.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 120 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.11'
          - '1.12'
        os:
          - ubuntu-latest
        arch:
          - x64
        include:
          - os: windows-latest
            arch: x64
            version: '1.12'
          - os: macOS-latest
            arch: aarch64
            version: '1.12'
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      # Caches the whole depot (packages, compiled images, artifacts, registries), not just
      # artifacts, so cached runs don't have to recompile the full ModelingToolkit/Symbolics/
      # GLMakie dependency stack from scratch.
      - uses: julia-actions/cache@v3
      # Precompiling that same dependency stack is much slower on Windows, in large part
      # because Windows Defender real-time scanning inspects every file the compiler writes;
      # excluding the Julia depot from scanning cuts precompilation time substantially.
      - name: Exclude the Julia depot from Windows Defender scanning (Windows only)
        if: runner.os == 'Windows'
        shell: powershell
        run: Add-MpPreference -ExclusionPath "$env:USERPROFILE\.julia"
      - name: Start virtual display (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y xvfb
          Xvfb :99 -screen 0 1024x768x24 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
      # Use the checked-in manifest for this Julia version, so that the tests run against
      # the package versions the examples were written for, instead of whatever resolves
      # newest on the day. Julia versions without a `.default` file resolve normally.
      - name: Use the pinned manifest, if there is one for this Julia version
        shell: bash
        run: |
          v=$(julia -e 'print(VERSION.major, ".", VERSION.minor)')
          src="Manifest-v$v.toml.default"
          if [ -f "$src" ]; then
            cp "$src" "Manifest-v$v.toml"
            echo "using pinned $src"
          else
            echo "no pinned manifest for Julia $v, resolving the latest versions"
          fi
      - uses: julia-actions/julia-buildpkg@v1
      # Not julia-actions/julia-runtest: it calls `Pkg.test()`, which copies test/Project.toml
      # into a temp sandbox without making the `[sources]` path absolute, so `path = ".."` no
      # longer points at the package. Activate the test project in place instead.
      - name: Instantiate the test project
        run: julia --project=test -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'
      - name: Run the tests
        run: julia --project=test --color=yes --check-bounds=yes --code-coverage=user test/runtests.jl
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - name: Start virtual display
        run: |
          sudo apt-get update -y
          sudo apt-get install -y xvfb
          Xvfb :99 -screen 0 1024x768x24 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-docdeploy@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
      - run: |
          julia --project=docs -e '
            using Documenter: DocMeta, doctest
            using Tethers
            DocMeta.setdocmeta!(Tethers, :DocTestSetup, :(using Tethers); recursive=true)
            doctest(Tethers)'
